---
layout: default
---
<main class="post-page">
  <section style="max-width:800px; margin:0 auto; padding:6rem 2rem 4rem;">
    <div style="margin-bottom:2rem;">
      <span style="color:var(--neon);font-size:0.8rem;letter-spacing:0.15em;">
        {{ page.date | date: "%Y.%m.%d" }}
      </span>
      {% if page.tags %}
      <div style="margin-top:0.5rem; display:flex; gap:0.4rem; flex-wrap:wrap;">
        {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
      {% endif %}
    </div>
    <h1 style="color:#fff; font-size:2rem; margin-bottom:2rem;">{{ page.title }}</h1>
    <div class="post-content">
      {{ content }}
    </div>
  </section>
</main>
